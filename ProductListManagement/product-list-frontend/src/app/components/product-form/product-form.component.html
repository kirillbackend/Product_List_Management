<div class="container">
  <nav class="navbar">
    <h1>Product Management</h1>
    <button class="btn btn-danger" (click)="onLogout()">Logout</button>
  </nav>

  <div class="form-container">
    <h2>{{ isEdit ? 'Edit Product' : 'Create Product' }}</h2>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="product-form">
      <div class="form-group">
        <label for="name">Product Name *</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="form-control"
          placeholder="Enter product name"
          [class.is-invalid]="productForm.get('name')?.invalid && productForm.get('name')?.touched"
        >
        <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched" class="invalid-feedback">
          <div *ngIf="productForm.get('name')?.errors?.['required']">Product name is required</div>
          <div *ngIf="productForm.get('name')?.errors?.['maxlength']">Product name cannot exceed 100 characters</div>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <textarea
          id="description"
          formControlName="description"
          class="form-control"
          rows="4"
          placeholder="Enter product description"
          [class.is-invalid]="productForm.get('description')?.invalid && productForm.get('description')?.touched"
        ></textarea>
        <div *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched" class="invalid-feedback">
          <div *ngIf="productForm.get('description')?.errors?.['required']">Description is required</div>
          <div *ngIf="productForm.get('description')?.errors?.['maxlength']">Description cannot exceed 500 characters</div>
        </div>
      </div>

      <div class="form-group">
        <label for="price">Price *</label>
        <input
          type="number"
          id="price"
          formControlName="price"
          class="form-control"
          min="0.01"
          step="0.01"
          placeholder="0.00"
          [class.is-invalid]="productForm.get('price')?.invalid && productForm.get('price')?.touched"
        >
        <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched" class="invalid-feedback">
          <div *ngIf="productForm.get('price')?.errors?.['required']">Price is required</div>
          <div *ngIf="productForm.get('price')?.errors?.['min']">Price must be greater than 0</div>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="productForm.invalid || loading"
        >
          {{ loading ? 'Saving...' : (isEdit ? 'Update' : 'Create') }}
        </button>
        
        <button 
          type="button" 
          class="btn btn-secondary"
          (click)="onCancel()"
          [disabled]="loading"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
